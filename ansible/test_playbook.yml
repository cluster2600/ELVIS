---
- name: Test ELVIS Trading Bot Setup (Essential Dependencies Only)
  hosts: localhost
  connection: local
  vars:
    project_dir: "{{ playbook_dir }}/.."
    python_version: "3.14"
    
  tasks:
    - name: Display system information
      debug:
        msg: |
          OS Family: {{ ansible_os_family }}
          Distribution: {{ ansible_distribution }}
          Project Directory: {{ project_dir }}
          Current User: {{ ansible_user_id }}
    
    - name: Check if we're on macOS
      debug:
        msg: "Running on macOS"
      when: ansible_os_family == "Darwin"
    
    - name: Check if we're on Linux
      debug:
        msg: "Running on Linux ({{ ansible_distribution }})"
      when: ansible_os_family != "Darwin"
    
    - name: Test Python 3 availability
      command: python3 --version
      register: python_version_check
      
    - name: Display Python version
      debug:
        msg: "Python version: {{ python_version_check.stdout }}"
    
    - name: Check if virtual environment exists
      stat:
        path: "{{ project_dir }}/venv"
      register: venv_check
      
    - name: Display virtual environment status
      debug:
        msg: |
          Virtual environment exists: {{ venv_check.stat.exists }}
          Path: {{ project_dir }}/venv
    
    - name: Test project directory access
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'
      
    - name: Check requirements files
      stat:
        path: "{{ project_dir }}/{{ item }}"
      register: req_files
      loop:
        - requirements.txt
        - requirements_coreml.txt
        - requirements_ydf.txt
        - .env.example
        - scripts/run_elvis.sh
        
    - name: Display requirements file status
      debug:
        msg: "{{ item.item }}: {{ 'EXISTS' if item.stat.exists else 'MISSING' }}"
      loop: "{{ req_files.results }}"