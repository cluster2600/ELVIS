---
- name: Install ELVIS Trading Bot Dependencies
  hosts: localhost
  vars:
    project_name: "BTC_BOT"
    project_user: "{{ ansible_user_id }}"
    project_dir: "{{ playbook_dir }}/.."
    python_version: "3.11"
    node_version: "18"
    
  tasks:
    - name: Update package cache (Ubuntu/Debian)
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
      become: yes
      
    - name: Update package cache (CentOS/RHEL)
      yum:
        update_cache: yes
      when: ansible_os_family == "RedHat"
      become: yes
      
    - name: Install system dependencies (Ubuntu/Debian)
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
          - build-essential
          - git
          - curl
          - wget
          - unzip
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - pkg-config
          - libffi-dev
          - libssl-dev
          - libbz2-dev
          - libreadline-dev
          - libsqlite3-dev
          - libncursesw5-dev
          - xz-utils
          - tk-dev
          - libxml2-dev
          - libxmlsec1-dev
          - liblzma-dev
          - libhdf5-dev
          - libatlas-base-dev
          - gfortran
          - redis-server
          - postgresql
          - postgresql-contrib
          - libpq-dev
          - unzip
          - jq
        state: present
      when: ansible_os_family == "Debian"
      become: yes
      
    - name: Install system dependencies (CentOS/RHEL)
      yum:
        name:
          - python3
          - python3-pip
          - python3-devel
          - gcc
          - gcc-c++
          - make
          - git
          - curl
          - wget
          - unzip
          - openssl-devel
          - bzip2-devel
          - libffi-devel
          - readline-devel
          - sqlite-devel
          - xz-devel
          - tk-devel
          - libxml2-devel
          - xmlsec1-devel
          - redis
          - postgresql
          - postgresql-server
          - postgresql-devel
          - unzip
          - jq
        state: present
      when: ansible_os_family == "RedHat"
      become: yes
      
    - name: Install system dependencies (macOS)
      community.general.homebrew:
        name:
          - python@3.11
          - git
          - curl
          - wget
          - openssl
          - readline
          - sqlite3
          - xz
          - tk
          - libxml2
          - libxmlsec1
          - redis
          - postgresql
          - jq
        state: present
      when: ansible_os_family == "Darwin"
      
    # TA-Lib Installation (Required for technical analysis)
    - name: Download TA-Lib source (Linux)
      get_url:
        url: "http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz"
        dest: "/tmp/ta-lib-0.4.0-src.tar.gz"
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Extract TA-Lib source
      unarchive:
        src: "/tmp/ta-lib-0.4.0-src.tar.gz"
        dest: "/tmp"
        remote_src: yes
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Configure TA-Lib
      command: ./configure --prefix=/usr/local
      args:
        chdir: "/tmp/ta-lib"
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Compile TA-Lib
      make:
        chdir: "/tmp/ta-lib"
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Install TA-Lib
      make:
        chdir: "/tmp/ta-lib"
        target: install
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Install TA-Lib via Homebrew (macOS)
      community.general.homebrew:
        name: ta-lib
        state: present
      when: ansible_os_family == "Darwin"
      
    - name: Update library path
      lineinfile:
        path: /etc/ld.so.conf.d/talib.conf
        line: "/usr/local/lib"
        create: yes
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Update library cache
      command: ldconfig
      when: ansible_os_family != "Darwin"
      become: yes
      
    # Docker Installation
    - name: Add Docker GPG key (Ubuntu/Debian)
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: ansible_os_family == "Debian"
      become: yes
      
    - name: Add Docker repository (Ubuntu/Debian)
      apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      when: ansible_os_family == "Debian"
      become: yes
      
    - name: Install Docker (Ubuntu/Debian)
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: ansible_os_family == "Debian"
      become: yes
      
    - name: Install Docker (CentOS/RHEL)
      yum:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: ansible_os_family == "RedHat"
      become: yes
      
    - name: Install Docker (macOS)
      community.general.homebrew_cask:
        name: docker
        state: present
      when: ansible_os_family == "Darwin"
      
    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Add user to docker group
      user:
        name: "{{ project_user }}"
        groups: docker
        append: yes
      when: ansible_os_family != "Darwin"
      become: yes
      
    # Node.js Installation (for potential web dashboard)
    - name: Install Node.js (Ubuntu/Debian)
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x | sudo -E bash -
        apt-get install -y nodejs
      when: ansible_os_family == "Debian"
      become: yes
      
    - name: Install Node.js (CentOS/RHEL)
      shell: |
        curl -fsSL https://rpm.nodesource.com/setup_{{ node_version }}.x | sudo bash -
        yum install -y nodejs
      when: ansible_os_family == "RedHat"
      become: yes
      
    - name: Install Node.js (macOS)
      community.general.homebrew:
        name: "node@{{ node_version }}"
        state: present
      when: ansible_os_family == "Darwin"
      
    # HashiCorp Vault Installation (for secure secrets management)
    - name: Add HashiCorp GPG key (Ubuntu/Debian)
      apt_key:
        url: https://apt.releases.hashicorp.com/gpg
        state: present
      when: ansible_os_family == "Debian"
      become: yes
      
    - name: Add HashiCorp repository (Ubuntu/Debian)
      apt_repository:
        repo: "deb [arch=amd64] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
        state: present
      when: ansible_os_family == "Debian"
      become: yes
      
    - name: Install Vault (Ubuntu/Debian)
      apt:
        name: vault
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"
      become: yes
      
    - name: Add HashiCorp Yum repository (CentOS/RHEL)
      yum_repository:
        name: hashicorp
        description: HashiCorp Stable
        baseurl: https://rpm.releases.hashicorp.com/RHEL/$releasever/$basearch/stable
        enabled: yes
        gpgcheck: yes
        gpgkey: https://rpm.releases.hashicorp.com/gpg
      when: ansible_os_family == "RedHat"
      become: yes
      
    - name: Install Vault (CentOS/RHEL)
      yum:
        name: vault
        state: present
      when: ansible_os_family == "RedHat"
      become: yes
      
    - name: Install Vault (macOS)
      community.general.homebrew:
        name: vault
        state: present
      when: ansible_os_family == "Darwin"
      
    - name: Create vault user
      user:
        name: vault
        system: yes
        shell: /bin/false
        home: /opt/vault
        create_home: yes
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Create vault directories
      file:
        path: "{{ item }}"
        state: directory
        owner: vault
        group: vault
        mode: '0755'
      loop:
        - /opt/vault
        - /opt/vault/data
        - /opt/vault/logs
        - /etc/vault.d
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Create vault configuration file
      copy:
        content: |
          # Development configuration for ELVIS Trading Bot
          # WARNING: This is for development only - use proper TLS and auth in production
          
          storage "file" {
            path = "/opt/vault/data"
          }
          
          listener "tcp" {
            address     = "127.0.0.1:8200"
            tls_disable = 1
          }
          
          api_addr = "http://127.0.0.1:8200"
          cluster_addr = "http://127.0.0.1:8201"
          ui = true
          
          # Enable KV secrets engine
          path "secret/*" {
            capabilities = ["create", "read", "update", "delete", "list", "sudo"]
          }
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: vault
        mode: '0640'
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Create vault systemd service
      copy:
        content: |
          [Unit]
          Description=HashiCorp Vault
          Documentation=https://www.vaultproject.io/docs/
          Requires=network-online.target
          After=network-online.target
          ConditionFileNotEmpty=/etc/vault.d/vault.hcl
          StartLimitIntervalSec=60
          StartLimitBurst=3
          
          [Service]
          Type=notify
          User=vault
          Group=vault
          ProtectSystem=full
          ProtectHome=read-only
          PrivateTmp=yes
          PrivateDevices=yes
          SecureBits=keep-caps
          AmbientCapabilities=CAP_IPC_LOCK
          Capabilities=CAP_IPC_LOCK+ep
          CapabilityBoundingSet=CAP_SYSLOG CAP_IPC_LOCK
          NoNewPrivileges=yes
          ExecStart=/usr/bin/vault server -config=/etc/vault.d/vault.hcl
          ExecReload=/bin/kill --signal HUP $MAINPID
          KillMode=process
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=30
          StartLimitInterval=60
          StartLimitBurst=3
          LimitNOFILE=65536
          LimitMEMLOCK=infinity
          
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/vault.service
        mode: '0644'
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Enable and start vault service
      systemd:
        name: vault
        enabled: yes
        state: started
        daemon_reload: yes
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Wait for Vault to start
      wait_for:
        port: 8200
        host: 127.0.0.1
        timeout: 30
      when: ansible_os_family != "Darwin"
      
    - name: Check if Vault is already initialized
      uri:
        url: http://127.0.0.1:8200/v1/sys/init
        method: GET
      register: vault_init_status
      when: ansible_os_family != "Darwin"
      ignore_errors: yes
      
    - name: Initialize Vault
      uri:
        url: http://127.0.0.1:8200/v1/sys/init
        method: PUT
        body_format: json
        body:
          secret_shares: 5
          secret_threshold: 3
      register: vault_init
      when: ansible_os_family != "Darwin" and vault_init_status.json is defined and not vault_init_status.json.initialized
      
    - name: Save Vault keys and token (DEVELOPMENT ONLY)
      copy:
        content: |
          # DEVELOPMENT VAULT CREDENTIALS
          # WARNING: These are for development only! 
          # In production, store these securely and distribute keys to different people
          
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN={{ vault_init.json.root_token if vault_init.json is defined else 'trading-bot-token' }}
          
          # Unseal keys (store these separately in production):
          {% if vault_init.json is defined %}
          {% for key in vault_init.json.keys %}
          # Key {{ loop.index }}: {{ key }}
          {% endfor %}
          {% endif %}
          
          # To unseal Vault after restart:
          # vault operator unseal <key1>
          # vault operator unseal <key2>  
          # vault operator unseal <key3>
          
          # To enable KV secrets engine:
          # vault secrets enable -path=secret kv-v2
          
          # To store ELVIS trading secrets:
          # vault kv put secret/trading/api-keys \\
          #   binance-api-key=your-api-key \\
          #   binance-api-secret=your-api-secret
        dest: "{{ project_dir }}/.vault_credentials"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: '0600'
      when: ansible_os_family != "Darwin"
      become_user: "{{ project_user }}"
      become: no
      
    - name: Create Vault setup script for ELVIS
      copy:
        content: |
          #!/bin/bash
          # ELVIS Trading Bot Vault Setup Script
          
          set -e
          
          echo "🔐 Setting up HashiCorp Vault for ELVIS Trading Bot..."
          
          # Source vault credentials
          if [ -f "{{ project_dir }}/.vault_credentials" ]; then
              source "{{ project_dir }}/.vault_credentials"
              echo "✅ Vault credentials loaded"
          else
              echo "❌ Vault credentials not found. Using development defaults."
              export VAULT_ADDR=http://127.0.0.1:8200
              export VAULT_TOKEN=trading-bot-token
          fi
          
          # Wait for Vault to be ready
          echo "⏳ Waiting for Vault to be ready..."
          for i in {1..30}; do
              if vault status >/dev/null 2>&1; then
                  echo "✅ Vault is ready"
                  break
              fi
              echo "   Waiting... ($i/30)"
              sleep 2
          done
          
          # Enable KV secrets engine
          echo "🔧 Enabling KV secrets engine..."
          if ! vault secrets list | grep -q "secret/"; then
              vault secrets enable -path=secret kv-v2
              echo "✅ KV secrets engine enabled"
          else
              echo "✅ KV secrets engine already enabled"
          fi
          
          # Create default secrets structure for ELVIS
          echo "📝 Creating default secrets structure..."
          
          # Trading API keys (placeholder - user must update)
          vault kv put secret/trading/api-keys \
              binance-api-key=your-binance-api-key-here \
              binance-api-secret=your-binance-api-secret-here \
              telegram-bot-token=your-telegram-bot-token-here \
              || echo "⚠️  Failed to create trading API keys (may already exist)"
          
          # Database credentials
          vault kv put secret/database/credentials \
              postgres-host=localhost \
              postgres-user=elvis_user \
              postgres-password=secure-password-here \
              redis-password=redis-password-here \
              || echo "⚠️  Failed to create database credentials (may already exist)"
          
          # Notification webhooks
          vault kv put secret/notifications/webhooks \
              discord-webhook=https://discord.com/api/webhooks/your-webhook \
              slack-webhook=https://hooks.slack.com/services/your-webhook \
              || echo "⚠️  Failed to create notification webhooks (may already exist)"
          
          echo "🎯 Vault setup complete!"
          echo ""
          echo "📋 Next steps:"
          echo "1. Update your API keys in Vault:"
          echo "   vault kv put secret/trading/api-keys binance-api-key=REAL_KEY binance-api-secret=REAL_SECRET"
          echo ""
          echo "2. Set environment variables:"
          echo "   export VAULT_ADDR=http://127.0.0.1:8200"
          echo "   export VAULT_TOKEN=$VAULT_TOKEN"
          echo ""
          echo "3. Start ELVIS with Vault integration:"
          echo "   python main.py --mode dashboard"
          echo ""
          echo "✅ Vault will show as connected in the dashboard!"
          
        dest: "{{ project_dir }}/setup_vault.sh"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: '0755'
      become_user: "{{ project_user }}"
      become: no
      
    # Project Setup
    - name: Ensure project directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'
      become: no
      
    - name: Create Python virtual environment
      command: python3 -m venv "{{ project_dir }}/venv"
      become_user: "{{ project_user }}"
      become: no
      args:
        creates: "{{ project_dir }}/venv"
        
    - name: Upgrade pip in virtual environment
      pip:
        name: pip
        state: latest
        virtualenv: "{{ project_dir }}/venv"
      become_user: "{{ project_user }}"
      become: no
      
    - name: Install wheel and setuptools
      pip:
        name:
          - wheel
          - setuptools
        state: latest
        virtualenv: "{{ project_dir }}/venv"
      become_user: "{{ project_user }}"
      become: no
      
    - name: Install Python dependencies from requirements.txt
      pip:
        requirements: "{{ project_dir }}/requirements.txt"
        virtualenv: "{{ project_dir }}/venv"
      become_user: "{{ project_user }}"
      become: no
      when: ansible_os_family != "Darwin"
      
    - name: Install CoreML dependencies (macOS)
      pip:
        requirements: "{{ project_dir }}/requirements_coreml.txt"
        virtualenv: "{{ project_dir }}/venv"
      become_user: "{{ project_user }}"
      become: no
      when: ansible_os_family == "Darwin"
      
    - name: Install YDF dependencies
      pip:
        requirements: "{{ project_dir }}/requirements_ydf.txt"
        virtualenv: "{{ project_dir }}/venv"
      become_user: "{{ project_user }}"
      become: no
      ignore_errors: yes  # In case file doesn't exist
      
    # Database Setup
    - name: Initialize PostgreSQL database (CentOS/RHEL)
      command: postgresql-setup initdb
      when: ansible_os_family == "RedHat"
      ignore_errors: yes
      become: yes
      
    - name: Start and enable PostgreSQL
      systemd:
        name: postgresql
        state: started
        enabled: yes
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Start and enable Redis
      systemd:
        name: redis
        state: started
        enabled: yes
      when: ansible_os_family != "Darwin"
      become: yes
      
    # Create necessary directories
    - name: Create project subdirectories
      file:
        path: "{{ project_dir }}/{{ item }}"
        state: directory
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: '0755'
      become_user: "{{ project_user }}"
      become: no
      loop:
        - data
        - logs
        - models
        - config
        - scripts
        - ansible
        
    # Environment configuration
    - name: Copy environment example file
      copy:
        src: "{{ project_dir }}/.env.example"
        dest: "{{ project_dir }}/.env"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: '0600'
        remote_src: yes
      become_user: "{{ project_user }}"
      become: no
      ignore_errors: yes
      
    # Make scripts executable
    - name: Make shell scripts executable
      file:
        path: "{{ project_dir }}/{{ item }}"
        mode: '0755'
      become_user: "{{ project_user }}"
      become: no
      loop:
        - run_elvis.sh
        - run_training.sh
        - run_api.sh
        - run_tests.sh
      ignore_errors: yes
      
    # System service setup (optional)
    - name: Create systemd service file for ELVIS bot
      template:
        src: templates/elvis-bot.service.j2
        dest: /etc/systemd/system/elvis-bot.service
        mode: '0644'
      when: ansible_os_family != "Darwin"
      become: yes
      
    - name: Reload systemd
      systemd:
        daemon_reload: yes
      when: ansible_os_family != "Darwin"
      become: yes
      
    # Final setup and information
    - name: Display setup completion instructions
      debug:
        msg: |
          
          🔐 ELVIS Trading Bot Setup Complete with HashiCorp Vault Integration!
          
          📋 Deployment Options:
          
          🏗️ OPTION 1: Native Installation (Traditional)
          1. 🔑 Setup Vault secrets:
             cd {{ project_dir }}
             ./setup_vault.sh
          
          2. 🔐 Configure API keys:
             source .vault_credentials
             vault kv put secret/trading/api-keys \
               binance-api-key=YOUR_REAL_API_KEY \
               binance-api-secret=YOUR_REAL_API_SECRET
          
          3. 🚀 Start ELVIS:
             export VAULT_ADDR=http://127.0.0.1:8200
             export VAULT_TOKEN=trading-bot-token
             python main.py --mode dashboard
          
          🐳 OPTION 2: Containerized Infrastructure (Recommended)
          1. 🚀 Deploy monitoring stack:
             cd {{ project_dir }}/ansible
             ansible-playbook deploy_containers.yml
          
          2. 📊 Start hybrid system:
             cd {{ project_dir }}
             ./start_elvis_hybrid.sh
          
          3. 📈 Access dashboards:
             - Grafana: http://localhost:3001 (admin/admin)
             - Prometheus: http://localhost:9090
             - ELVIS API: http://localhost:5050
          
          📚 Documentation:
          - System Guide: {{ project_dir }}/ELVIS_MONITORING_SYSTEM_COMPLETE.md
          - Architecture: {{ project_dir }}/ELVIS_SYSTEM_ARCHITECTURE.md
          - Container Guide: {{ project_dir }}/ansible/deploy_containers.yml
          
          🎯 Production Features:
          ✅ Enterprise-grade secret management (Vault)
          ✅ Real-time monitoring (Prometheus + Grafana)
          ✅ Centralized logging (Loki + Promtail)
          ✅ Container orchestration (Docker Compose)
          ✅ High-frequency trading capabilities
          ✅ Comprehensive health monitoring
          
          🔐 Security first, performance optimized!
      
  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted
      when: ansible_os_family != "Darwin"
      become: yes
