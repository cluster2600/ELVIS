---
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars:
    # Global variables for all hosts
    project_name: "elvis-trading-bot"
    python_version: "3.11"
    node_version: "18"
    
    # Environment-specific variables
    env_type: "development"  # development, staging, production
    
    # Database configuration
    postgresql_version: "15"
    redis_version: "7"
    
    # Security settings
    enable_firewall: true
    allowed_ports:
      - 22    # SSH
      - 80    # HTTP
      - 443   # HTTPS
      - 3000  # Grafana
      - 5050  # Trade History API
      - 6379  # Redis
      - 8000  # Web Dashboard
      - 9090  # Prometheus
      
development:
  hosts:
    localhost:
  vars:
    # Development-specific variables
    debug_mode: true
    log_level: "DEBUG"
    enable_hot_reload: true
    
staging:
  hosts:
    staging-server:
      ansible_host: "staging.example.com"
      ansible_user: "deploy"
  vars:
    # Staging-specific variables
    debug_mode: false
    log_level: "INFO"
    enable_ssl: true
    
production:
  hosts:
    prod-server-1:
      ansible_host: "prod1.example.com"
      ansible_user: "deploy"
    prod-server-2:
      ansible_host: "prod2.example.com"
      ansible_user: "deploy"
  vars:
    # Production-specific variables
    debug_mode: false
    log_level: "WARNING"
    enable_ssl: true
    enable_monitoring: true
    backup_enabled: true
