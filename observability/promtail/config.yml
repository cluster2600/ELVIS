server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: elvis-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: elvis
          service: trading-bot
          __path__: /var/log/elvis/elvis.log
    pipeline_stages:
      - regex:
          expression: '\x1b\[[0-9;]*m(?P<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2},\d{3})\s*-\s*(?P<level>\w+)\s*-\s*(?P<message>.*?)\x1b\[0m'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05,000'
          location: UTC