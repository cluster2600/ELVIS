version: '3.8'

services:
  # PostgreSQL Database for ELVIS Paper Trading
  postgres:
    image: postgres:15-alpine
    container_name: elvis-postgres
    environment:
      POSTGRES_DB: elvis_trading
      POSTGRES_USER: elvis_user
      POSTGRES_PASSWORD: elvis_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elvis_user -d elvis_trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - elvis-network

  # ELVIS Trading Bot - Enhanced for Apple Container System
  elvis-bot:
    build:
      context: .
      dockerfile: Dockerfile.minimal  # Use minimal build for core functionality
    container_name: elvis-trading-bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # Trading Configuration
      - TRADING_MODE=paper
      - STRATEGY_MODE=ensemble
      - HIGH_FREQUENCY_TRADING=true
      - LEVERAGE=100
      - PROFIT_MODE=aggressive
      - COOLDOWN_DISABLED=true
      
      # Database Configuration (Required for paper trading)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=elvis_user
      - POSTGRES_PASSWORD=elvis_password
      - POSTGRES_DBNAME=elvis_trading
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      
      # Paper Trading Initial Balances
      - INITIAL_USDT_BALANCE=1000.0
      - INITIAL_BNB_BALANCE=1000.0
      
      # API Keys (from environment or .env file)
      - BINANCE_FUTURES_TESTNET_API_KEY=${BINANCE_FUTURES_TESTNET_API_KEY:-}
      - BINANCE_FUTURES_TESTNET_API_SECRET=${BINANCE_FUTURES_TESTNET_API_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      
      # Container Configuration
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./.env:/app/.env:ro  # Mount environment file
    ports:
      - "5050:5050"  # Dashboard API
      - "8000:8000"  # Web Interface
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5050/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - elvis-network

  redis:
    image: redis:7-alpine
    container_name: elvis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - elvis-network

  prometheus:
    image: prom/prometheus:latest
    container_name: elvis-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - elvis-network

  grafana:
    image: grafana/grafana:latest
    container_name: elvis-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - elvis-network

  loki:
    image: grafana/loki:2.9.0
    container_name: elvis-loki
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - elvis-network

  promtail:
    image: grafana/promtail:2.9.0
    container_name: elvis-promtail
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml
      - ./logs:/var/log/elvis
      - ./elvis_enhanced_metrics.log:/var/log/elvis/elvis.log:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - elvis-network

networks:
  elvis-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
