name: V2 operator prerelease

on:
  push:
    tags:
      - v2.0.0-alpha.2

permissions: {}

concurrency:
  group: v2-operator-release-${{ github.ref }}
  cancel-in-progress: false

env:
  V2_RELEASE_TAG: v2.0.0-alpha.2
  V2_PROJECT_VERSION: 2.0.0a2
  V2_IMAGE_VERSION: 2.0.0-alpha.2
  V2_IMAGE: ghcr.io/cluster2600/elvis-v2-operator

jobs:
  verify:
    name: Verify exact tag and release contract
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release-commit: ${{ steps.release-identity.outputs.commit }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Require the approved tag on the current main commit
        id: release-identity
        shell: bash
        run: |
          set -euo pipefail

          [[ "${GITHUB_REPOSITORY}" == "cluster2600/ELVIS" ]]
          [[ "${GITHUB_REF_TYPE}" == "tag" ]]
          [[ "${GITHUB_REF_NAME}" == "${V2_RELEASE_TAG}" ]]
          [[ "${GITHUB_REF}" == "refs/tags/${V2_RELEASE_TAG}" ]]

          git fetch --force --no-tags \
            origin refs/heads/main:refs/remotes/origin/main
          tagged_commit="$(git rev-parse "refs/tags/${V2_RELEASE_TAG}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          main_commit="$(git rev-parse refs/remotes/origin/main)"

          [[ "${tagged_commit}" == "${event_commit}" ]]
          [[ "${tagged_commit}" == "${checked_out_commit}" ]]
          [[ "${tagged_commit}" == "${main_commit}" ]]
          printf 'commit=%s\n' "${tagged_commit}" >> "${GITHUB_OUTPUT}"

          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["V2_RELEASE_TAG"]
          project_version = os.environ["V2_PROJECT_VERSION"]
          image_version = os.environ["V2_IMAGE_VERSION"]
          expected = {
              "v2.0.0-alpha.2": ("2.0.0a2", "2.0.0-alpha.2"),
          }
          if expected.get(tag) != (project_version, image_version):
              raise SystemExit("unapproved release version mapping")

          document = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          if document["project"]["version"] != project_version:
              raise SystemExit("pyproject version does not match the release tag")
          if document["project"]["requires-python"] != ">=3.14,<3.15":
              raise SystemExit("release is not constrained to Python 3.14")
          PY

      - name: Require successful CI/CD Pipeline on the exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.release-identity.outputs.commit }}
        run: |
          set -euo pipefail
          ci_run_id="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${RELEASE_COMMIT}" \
            -f status=completed \
            -f per_page=100 \
            --jq '[.workflow_runs[] | select(
              .head_sha == env.RELEASE_COMMIT and
              .head_branch == "main" and
              .event == "push" and
              .name == "CI/CD Pipeline" and
              .status == "completed" and
              .conclusion == "success"
            )] | sort_by(.created_at) | .[-1].id // empty')"
          [[ -n "${ci_run_id}" ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}" \
            --jq '{id, head_sha, head_branch, event, status, conclusion}'

      - name: Require an anonymously pullable public bootstrap image
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          bootstrap_ref="${V2_IMAGE}:visibility-bootstrap"
          docker pull "${bootstrap_ref}"
          docker image inspect "${bootstrap_ref}" >/dev/null
          docker image rm "${bootstrap_ref}" >/dev/null

      - name: Run release contract tests
        run: |
          python -m pip install --disable-pip-version-check \
            "pytest==9.0.2" \
            "psycopg2-binary==2.9.12"
          python -m pytest -q tests/test_v2_release_contract.py

  publish-image:
    name: Publish attested multi-architecture operator image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push a run-unique candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/v2/operator.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.V2_IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.release-commit }}
            org.opencontainers.image.version=${{ env.V2_IMAGE_VERSION }}
            org.opencontainers.image.title=ELVIS V2 operator preview
            org.elvis.v2.scope=paper-migration-preview
            org.elvis.v2.active=NO-GO
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=v2-operator-release
          cache-to: type=gha,mode=max,scope=v2-operator-release

      - name: Attest the published manifest digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.V2_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  scan-image:
    name: Block fixed high and critical vulnerabilities (${{ matrix.platform }})
    needs: publish-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR for digest scan
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the exact published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          version: v0.70.0
          image-ref: ${{ env.V2_IMAGE }}@${{ needs.publish-image.outputs.image-digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  smoke:
    name: Smoke public anonymous install on both architectures
    needs: [publish-image, scan-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release support files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Clear registry credentials before public pulls
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Import-smoke all four commands anonymously on amd64 and arm64
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.image-digest }}
        run: |
          set -euo pipefail
          image_ref="${V2_IMAGE}@${IMAGE_DIGEST}"

          cleanup_smoke_image() {
            docker image rm "${image_ref}" >/dev/null 2>&1 || true
          }
          trap cleanup_smoke_image EXIT

          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "${platform}" "${image_ref}"
            help="$({
              docker run --rm \
                --platform "${platform}" \
                --read-only \
                --network none \
                --cap-drop ALL \
                --security-opt no-new-privileges \
                "${image_ref}" --help
            })"
            grep -F "ACTIVE NO-GO" <<<"${help}"
            for command in \
              bootstrap \
              cutover-preflight \
              import-snapshot \
              reconcile-snapshot
            do
              grep -F "${command}" <<<"${help}"
              docker run --rm \
                --platform "${platform}" \
                --read-only \
                --network none \
                --cap-drop ALL \
                --security-opt no-new-privileges \
                "${image_ref}" "${command}" --help >/dev/null
            done
            docker image rm "${image_ref}" >/dev/null
          done

          trap - EXIT

      - name: Smoke a clean-directory Compose install
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.image-digest }}
        run: |
          set -euo pipefail
          preview_dir="$(mktemp -d)"
          cp deploy/v2/compose.preview.yml "${preview_dir}/"
          cp deploy/v2/v2-preview.env.example "${preview_dir}/.env"
          mkdir "${preview_dir}/operator"
          cd "${preview_dir}"
          export ELVIS_V2_OPERATOR_IMAGE="${V2_IMAGE}@${IMAGE_DIGEST}"

          cleanup() {
            docker compose --env-file .env -f compose.preview.yml \
              down --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose --env-file .env -f compose.preview.yml config --quiet
          [[ "$(docker compose --env-file .env -f compose.preview.yml config --images)" \
            == "${V2_IMAGE}@${IMAGE_DIGEST}" ]]
          docker compose --env-file .env -f compose.preview.yml pull
          help="$(docker compose --env-file .env -f compose.preview.yml \
            run --rm --no-deps operator --help)"
          grep -F "ACTIVE NO-GO" <<<"${help}"
          grep -F "reconcile-snapshot" <<<"${help}"

  assets:
    name: Build and attest the install bundle
    needs: [verify, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR for SBOM generation
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build deterministic install bundle
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.image-digest }}
        run: |
          set -euo pipefail
          asset_stem="elvis-v2-operator-${V2_RELEASE_TAG}"
          bundle_dir="dist/${asset_stem}"
          mkdir -p "${bundle_dir}/operator-examples"

          cp INSTALL_V2.md RELEASE_NOTES.md LICENSE "${bundle_dir}/"
          cp deploy/v2/compose.preview.yml "${bundle_dir}/"
          cp deploy/v2/v2-preview.env.example "${bundle_dir}/"
          cp deploy/v2/pg_service.preview.conf.example \
            "${bundle_dir}/operator-examples/"
          cp deploy/v2/*-v1.example.json \
            "${bundle_dir}/operator-examples/"
          printf '%s@%s\n' "${V2_IMAGE}" "${IMAGE_DIGEST}" \
            > "${bundle_dir}/IMAGE_DIGEST.txt"
          cp "${bundle_dir}/IMAGE_DIGEST.txt" dist/IMAGE_DIGEST.txt

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -czf "dist/${asset_stem}.tar.gz" \
            "${asset_stem}"

      - name: Generate amd64 SPDX image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ env.V2_IMAGE }}@${{ needs.publish-image.outputs.image-digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/elvis-v2-operator-${{ env.V2_RELEASE_TAG }}-linux-amd64.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate arm64 SPDX image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_PLATFORM: linux/arm64
        with:
          image: ${{ env.V2_IMAGE }}@${{ needs.publish-image.outputs.image-digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/elvis-v2-operator-${{ env.V2_RELEASE_TAG }}-linux-arm64.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate subject checksums for attestation
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            "elvis-v2-operator-${V2_RELEASE_TAG}.tar.gz" \
            "elvis-v2-operator-${V2_RELEASE_TAG}-linux-amd64.spdx.json" \
            "elvis-v2-operator-${V2_RELEASE_TAG}-linux-arm64.spdx.json" \
            IMAGE_DIGEST.txt \
            > ATTESTED_SHA256SUMS

      - name: Attest checksummed release assets
        id: attest-assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/ATTESTED_SHA256SUMS

      - name: Collect the provenance bundle
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest-assets.outputs.bundle-path }}" \
            "dist/elvis-v2-operator-${V2_RELEASE_TAG}.intoto.jsonl"

      - name: Generate complete release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            "elvis-v2-operator-${V2_RELEASE_TAG}.tar.gz" \
            "elvis-v2-operator-${V2_RELEASE_TAG}-linux-amd64.spdx.json" \
            "elvis-v2-operator-${V2_RELEASE_TAG}-linux-arm64.spdx.json" \
            "elvis-v2-operator-${V2_RELEASE_TAG}.intoto.jsonl" \
            IMAGE_DIGEST.txt \
            > SHA256SUMS

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v2-operator-release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/elvis-v2-operator-${{ env.V2_RELEASE_TAG }}.tar.gz
            dist/elvis-v2-operator-${{ env.V2_RELEASE_TAG }}-linux-amd64.spdx.json
            dist/elvis-v2-operator-${{ env.V2_RELEASE_TAG }}-linux-arm64.spdx.json
            dist/elvis-v2-operator-${{ env.V2_RELEASE_TAG }}.intoto.jsonl
            dist/IMAGE_DIGEST.txt
            dist/SHA256SUMS

  release:
    name: Create GitHub prerelease after every gate
    needs: [verify, publish-image, scan-image, smoke, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download attested release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v2-operator-release-assets
          path: release-assets

      - name: Set up Docker Buildx for immutable tag promotion
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR for immutable tag promotion
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Recheck asset checksums
        run: cd release-assets && sha256sum --check SHA256SUMS

      - name: Promote the verified digest without moving existing tags
        env:
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.image-digest }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
        shell: bash
        run: |
          set -euo pipefail
          commit_ref="${V2_IMAGE}:sha-${RELEASE_COMMIT}"
          versioned_ref="${V2_IMAGE}:${V2_IMAGE_VERSION}"
          immutable_ref="${V2_IMAGE}@${IMAGE_DIGEST}"
          registry_repository="cluster2600/elvis-v2-operator"
          registry_token="$(
            curl --fail --silent --show-error --get \
              --data-urlencode 'service=ghcr.io' \
              --data-urlencode "scope=repository:${registry_repository}:pull" \
              https://ghcr.io/token \
              | jq -er '.token'
          )"

          promote_or_verify() {
            target_ref="$1"
            target_tag="${target_ref##*:}"
            response_headers="$(mktemp)"
            status="$(
              curl --silent --show-error --location \
                --output /dev/null \
                --dump-header "${response_headers}" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${registry_token}" \
                --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/${registry_repository}/manifests/${target_tag}"
            )"

            case "${status}" in
              200)
                existing_digest="$(awk \
                  'tolower($1) == "docker-content-digest:" {
                    gsub(/\r/, "", $2); digest = $2
                  } END {print digest}' "${response_headers}")"
                rm -f "${response_headers}"
                [[ -n "${existing_digest}" ]]
                [[ "${existing_digest}" == "${IMAGE_DIGEST}" ]]
                ;;
              404)
                rm -f "${response_headers}"
                docker buildx imagetools create \
                  --tag "${target_ref}" \
                  "${immutable_ref}"
                ;;
              *)
                rm -f "${response_headers}"
                printf 'registry probe for %s returned HTTP %s\n' \
                  "${target_ref}" "${status}" >&2
                return 1
                ;;
            esac

            promoted="$(docker buildx imagetools inspect "${target_ref}")"
            promoted_digest="$(awk '$1 == "Digest:" {print $2; exit}' \
              <<<"${promoted}")"
            [[ "${promoted_digest}" == "${IMAGE_DIGEST}" ]]
          }

          promote_or_verify "${commit_ref}"
          promote_or_verify "${versioned_ref}"

      - name: Create a non-latest GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${V2_RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ELVIS V2 operator preview ${V2_RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            --latest=false \
            --verify-tag

      - name: Verify published prerelease state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${V2_RELEASE_TAG}" \
            --jq 'select(.draft == false and .prerelease == true) | .tag_name' \
            | grep -Fx "${V2_RELEASE_TAG}"
          latest_tag="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          [[ "${latest_tag}" != "${V2_RELEASE_TAG}" ]]
