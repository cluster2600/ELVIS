name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.14'
  BLACK_VERSION: '26.5.1'
  ISORT_VERSION: '8.0.1'
  FLAKE8_VERSION: '7.3.0'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install \
          "black==${BLACK_VERSION}" \
          "flake8==${FLAKE8_VERSION}" \
          "isort==${ISORT_VERSION}"
    
    - name: Run Black
      run: black --check .
    
    - name: Run isort
      run: isort --check-only .
    
    - name: Run Flake8
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: Run Tests (3.14)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc g++ libgomp1
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"
        python -m pip install pytest-cov pytest-mock

    - name: Smoke canonical Python 3.14 dependencies
      run: python -c "import rich, seaborn, talib, trading"
    
    - name: Run unit tests
      run: |
        pytest tests/ -v -m "not perf and not postgres" --cov=. --cov-report=xml --cov-report=html
      env:
        PYTHONPATH: ${{ github.workspace }}
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  ml-contract:
    name: Python 3.14 ML Contracts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install the canonical ML extra
      run: |
        python -m pip install --upgrade pip
        python -m pip install \
          --extra-index-url https://download.pytorch.org/whl/cpu \
          -e ".[ml,test]"

    - name: Run Python 3.14 ML contracts
      run: |
        python -m pytest -q \
          tests/test_training_optional_deps.py \
          tests/test_ensemble_model.py \
          tests/test_ensemble_placeholder_retirement.py \
          tests/test_integration.py

  postgres:
    name: PostgreSQL 15 Integration (3.14)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install PostgreSQL test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install \
          pytest pytest-timeout psycopg2-binary python-dotenv \
          keyring cryptography hvac colorlog

    - name: Run isolated PostgreSQL tests
      run: pytest -q -ra -m postgres tests/postgres
      env:
        PYTHONPATH: ${{ github.workspace }}
        VAULT_ENABLED: 'false'
        ELVIS_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        ELVIS_TEST_POSTGRES_REQUIRED: '1'

  v2-postgres-rehearsal:
    name: V2 Fresh PostgreSQL Rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'

    - name: Install rehearsal test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "pytest==9.0.2" "psycopg2-binary==2.9.12"

    - name: Run isolated fresh-cluster rehearsal
      run: pytest -q -ra tests/postgres/test_v2_fresh_rehearsal_postgres.py
      env:
        PYTHONPATH: ${{ github.workspace }}
        ELVIS_TEST_V2_FRESH_REHEARSAL_REQUIRED: '1'

  v2-cutover-preflight:
    name: V2 Fresh-target Cut-over Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'

    - name: Install preflight test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "pytest==9.0.2" "psycopg2-binary==2.9.12"

    - name: Run isolated two-cluster cut-over preflight
      run: pytest -q -ra tests/postgres/test_postgres_cutover_preflight_postgres.py
      env:
        PYTHONPATH: ${{ github.workspace }}
        ELVIS_TEST_V2_CUTOVER_PREFLIGHT_REQUIRED: '1'

  v2-legacy-snapshot-import:
    name: V2 Bounded Legacy Snapshot Import
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'

    - name: Install snapshot-import test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "pytest==9.0.2" "psycopg2-binary==2.9.12"

    - name: Run isolated two-cluster snapshot import
      run: pytest -q -ra tests/postgres/test_postgres_legacy_snapshot_import_postgres.py
      env:
        PYTHONPATH: ${{ github.workspace }}
        ELVIS_TEST_V2_LEGACY_SNAPSHOT_IMPORT_REQUIRED: '1'

  v2-legacy-snapshot-reconciliation:
    name: V2 Read-only Legacy Snapshot Reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'

    - name: Install reconciliation test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install \
          "pytest==9.0.2" "pytest-timeout==2.4.0" \
          "psycopg2-binary==2.9.12"

    - name: Run isolated two-cluster reconciliation review
      run: pytest -q -ra tests/postgres/test_postgres_legacy_snapshot_reconciliation_postgres.py
      env:
        PYTHONPATH: ${{ github.workspace }}
        ELVIS_TEST_V2_LEGACY_SNAPSHOT_RECONCILIATION_REQUIRED: '1'

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF upload
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      with:
        version: 'v0.70.0'
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
      with:
        sarif_file: 'trivy-results.sarif'

  docker:
    name: Build Compatibility Paper Image
    runs-on: ubuntu-latest
    needs: [lint, test, postgres]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Build the retained paper image without publishing it
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        push: false
        cache-from: type=gha,scope=compatibility-paper-image
        cache-to: type=gha,mode=max,scope=compatibility-paper-image

  v2-operator-image:
    name: Build V2 Operator Image (3.14, amd64/arm64)
    runs-on: ubuntu-latest
    needs: [lint, test, postgres]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Build both operator architectures without publishing them
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: deploy/v2/operator.Dockerfile
        platforms: linux/amd64,linux/arm64
        push: false
        cache-from: type=gha,scope=v2-operator-ci
        cache-to: type=gha,mode=max,scope=v2-operator-ci
