name: elvis-v2-operator-preview

services:
  operator:
    image: ${ELVIS_V2_OPERATOR_IMAGE:-ghcr.io/cluster2600/elvis-v2-operator:2.0.0-alpha.2}
    pull_policy: always
    user: ${ELVIS_V2_OPERATOR_UID:-65532}:${ELVIS_V2_OPERATOR_GID:-65532}
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      PGSERVICEFILE: /run/operator/pg_service.conf
      PGPASSFILE: /run/operator/pgpass
      PGCONNECT_TIMEOUT: "5"
    volumes:
      - type: bind
        source: ${ELVIS_V2_OPERATOR_DIR:-./operator}
        target: /run/operator
        read_only: true
    extra_hosts:
      - host.docker.internal:host-gateway
    command: ["--help"]
