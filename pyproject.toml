[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elvis-trading-bot"
version = "0.3.0"
description = "ELVIS algorithmic trading bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "tqdm",
  "rich",
  "pyyaml",
  "ccxt",
  "ta",
  "requests",
  "Flask",
  "Flask-CORS",
  "Flask-SocketIO",
  "Flask-Limiter",
  "flask-swagger-ui",
  "PyJWT",
  "prometheus-flask-exporter",
  "statsmodels",
  "python-binance",
  "binance-futures-connector",
  "python-telegram-bot",
  "redis",
  "prometheus-client",
  "SQLAlchemy",
  "websocket-client",
  "psycopg2-binary",
  "psutil",
  "colorlog",
  "python-dotenv",
  "keyring",
  "hvac",
  "cryptography",
  "protobuf>=3.20.3,<6.0.0",
]

[project.optional-dependencies]
# ML add-ons used by the ensemble/DRL paths (all import-guarded in code).
# TensorFlow is intentionally absent: no Python 3.14 wheel yet (checked
# 2026-07), so its training path remains isolated in Python 3.10.
ml = [
  "torch",
  "gymnasium",
  "openai",
  "TA-Lib",
  "xgboost",
  "lightgbm",
]
test = [
  "pytest",
  "pytest-timeout",
]

[tool.setuptools.packages.find]
include = ["core*", "trading*", "training*", "utils*", "config*", "services*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "perf: API latency/load benchmarks (run explicitly with -m perf)",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
