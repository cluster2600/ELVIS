[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elvis-trading-bot"
version = "2.0.0a2"
description = "ELVIS algorithmic trading bot"
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "tenacity",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "tqdm",
  "rich",
  "pyyaml",
  "ccxt",
  "ta",
  "TA-Lib==0.7.1",
  "requests",
  "Flask",
  "Flask-CORS",
  "Flask-SocketIO",
  "Flask-Limiter",
  "flask-swagger-ui",
  "PyJWT",
  "prometheus-flask-exporter",
  "statsmodels",
  "python-binance",
  "binance-futures-connector",
  "python-telegram-bot",
  "redis",
  "prometheus-client",
  "SQLAlchemy",
  "websocket-client",
  "psycopg2-binary",
  "psutil",
  "colorlog",
  "python-dotenv",
  "keyring",
  "hvac",
  "cryptography",
]

[project.optional-dependencies]
# Python 3.14 ML add-ons used by the supported PyTorch, ensemble, and DRL paths.
ml = [
  "torch==2.13.0",
  "gymnasium==1.3.0",
  "openai==3.0.0",
  "xgboost==3.4.0",
  "lightgbm==4.7.0",
]
test = [
  "pytest",
  "pytest-timeout",
]

[tool.setuptools.packages.find]
include = ["core*", "trading*", "training*", "utils*", "config*", "services*", "scripts*"]

[tool.setuptools.package-data]
"trading.persistence.sql_migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "perf: API latency/load benchmarks (run explicitly with -m perf)",
    "postgres: isolated PostgreSQL integration tests (requires an explicit admin DSN)",
]
filterwarnings = [
    "error::pytest.PytestReturnNotNoneWarning",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 88
